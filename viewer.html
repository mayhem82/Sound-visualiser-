<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Colour Vision Assist — Viewer</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📺</text></svg>">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="viewer.css">
</head>
<body>
<video id="remoteVideo" playsinline autoplay muted></video>

<div id="overlay">
  <div id="panel">
    <h1>Viewer mode</h1>
    <p>Shows a live, read-only view of what's being corrected on another device — this page never opens its own camera. Get the room code from that device's "Connect tablet" panel, type it in below, and tap Connect.</p>

    <label class="field-label">
      Room code
      <input id="roomInput" type="text" maxlength="5" autocapitalize="characters" autocomplete="off" placeholder="ROOM CODE">
    </label>
    <button id="connectBtn">Connect</button>
    <p id="status" class="status" role="status" aria-live="polite"></p>

    <p class="hint"><a href="index.html">&larr; Back to Sound Nebula</a></p>
  </div>
</div>

<p id="connectionBadge" class="hide" aria-live="polite"></p>

<script src="viewer.js"></script>
</body>
</html>
