<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Colour Vision Assist — Viewer</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📺</text></svg>">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="viewer.css">
</head>
<body>
<video id="remoteVideo" playsinline autoplay muted></video>

<div id="overlay">
  <div id="panel">
    <h1>Viewer mode</h1>
    <p>Shows a live, read-only view of what's being corrected on another device — this page never opens its own camera. Get a connection code from that device's "Connect tablet" panel, paste it below, then copy the reply code back to finish pairing.</p>

    <label class="field-label">
      Code from the other device
      <textarea id="offerInput" rows="4" placeholder="Paste the code shown on the other device here"></textarea>
    </label>
    <button id="connectBtn">Connect</button>
    <p id="status" class="status" role="status" aria-live="polite"></p>

    <div id="replyBlock" class="hide">
      <label class="field-label">
        Your reply code — copy this back to the other device
        <textarea id="answerOutput" rows="4" readonly></textarea>
      </label>
      <button id="copyAnswerBtn" class="hud-btn">Copy reply code</button>
    </div>

    <p class="hint"><a href="index.html">&larr; Back to Sound Nebula</a></p>
  </div>
</div>

<p id="connectionBadge" class="hide" aria-live="polite"></p>

<script src="viewer.js"></script>
</body>
</html>
