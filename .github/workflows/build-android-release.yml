name: Build Android app (signed release)

on:
  workflow_dispatch: {}

jobs:
  build-release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Decode signing keystore
        run: |
          echo "${{ secrets.VP_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed release AAB + APK
        env:
          VP_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          VP_KEYSTORE_PASSWORD: ${{ secrets.VP_KEYSTORE_PASSWORD }}
          VP_KEY_ALIAS: ${{ secrets.VP_KEY_ALIAS }}
          VP_KEY_PASSWORD: ${{ secrets.VP_KEY_PASSWORD }}
        run: ./gradlew bundleRelease assembleRelease --no-daemon

      - name: Remove decoded keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Upload release AAB (for Play Store upload)
        uses: actions/upload-artifact@v4
        with:
          name: sound-visualiser-release-aab
          path: android/app/build/outputs/bundle/release/*.aab

      - name: Upload release APK (for sideloading/testing)
        uses: actions/upload-artifact@v4
        with:
          name: sound-visualiser-release-apk
          path: android/app/build/outputs/apk/release/*.apk
